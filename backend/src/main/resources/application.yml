spring:
  application:
    name: aquafiles-backend

  # 1. Lee el archivo backend/.env si existe (no se sube a GitHub).
  config:
    import: optional:file:.env[.properties]

  # 2. Conexión a MySQL. Los valores vienen de variables de entorno.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/aquafiles?serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USUARIO:aquafiles}
    password: ${DB_CLAVE}

  # 3. JPA: Flyway crea las tablas. Hibernate NO las toca.
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  # 4. Flyway ejecuta los archivos de src/main/resources/db/migration en orden.
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}